name: CI

on:
  push:
    # Inclui a branch de trabalho/deploy (Render publica dela) — senão o CI não
    # roda nos nossos pushes e o gate não protege a produção.
    branches: [main, feat/nous-rebrand-financeiro]
  pull_request:
    branches: [main, feat/nous-rebrand-financeiro]

# Cancela runs antigos da mesma branch quando push novo chegar — evita fila
# acumular em pushes consecutivos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          # SECRET_KEY é exigido pelo create_app(). Em CI, qualquer string
          # serve — não é uma chave de prod.
          SECRET_KEY: ci-test-secret-not-for-prod
        # Exclui tests/load (Locust) — é teste de carga, não unit/integration.
        # Threshold 70% — base atual ~75%, deixa folga pra novos testes.
        run: |
          pytest tests/ -q --ignore=tests/load \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=70

  test-postgres:
    name: pytest (Postgres — paridade prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Roda a MESMA suíte contra Postgres (prod usa PG; dev/CI-base usam SQLite).
    # Pega divergências de dialeto — ordenação com acento, ILIKE, Decimal×float.
    # Informativo por ora: promover a blocking após o 1º run verde.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: nous_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests against Postgres
        env:
          SECRET_KEY: ci-test-secret-not-for-prod
          NOUS_TEST_DB_URL: postgresql+psycopg2://postgres:pg@localhost:5432/nous_test
        run: pytest tests/ -q --ignore=tests/load

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Run ruff
        # Soh checa erros (--select=E,F) — projeto ainda nao adotou style
        # rules. Pode evoluir pra full check depois de uma passada de cleanup.
        # Ignora:
        # - E501 (line length): codigo BR usa portugues + comentarios extensos
        # - E741 (l ambiguo): convencao do projeto, sem ambiguidade real
        # - F811 (redefinition): falso positivo em fluxo/__init__.py
        #   (param de funcao vs import de submodulo em escopos diferentes)
        run: ruff check app/ --select=E,F --ignore=E501,E741,F811

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # BLOQUEANTE: base revisada (bandit limpo com usedforsecurity=False nos
    # hashes de dedup; pip-audit limpo após o bump do cryptography). Uma nova
    # CVE ou finding de segurança agora reprova o build.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit + pip-audit
        run: pip install bandit==1.7.10 pip-audit==2.7.3

      - name: Run bandit (security scan no codigo)
        run: bandit -r app/ -ll --skip B101,B311

      - name: Run pip-audit (CVE em dependencias)
        run: pip-audit --requirement requirements.txt --strict
