# Render Blueprint — Nous Clinical (web via Docker + Postgres gerenciado).
# Deploy: render.com -> New + -> Blueprint -> selecione este repositorio.
# O Render le este arquivo e provisiona tudo. HTTPS e automatico.
services:
  - type: web
    name: nous-clinical
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon          # US-West (sem regiao no Brasil; latencia ~150ms, ok)
    plan: free              # VALIDACAO: gratis (site "dorme" apos 15min ocioso).
                            # Pra producao, troque para 'starter' (~US$7/mes).
    healthCheckPath: /health
    autoDeploy: true        # redeploy automatico a cada push na branch
    branch: feat/nous-rebrand-financeiro
    envVars:
      - key: SECRET_KEY
        generateValue: true            # Render gera uma chave forte e secreta
      - key: FLASK_ENV
        value: production
      - key: WEB_WORKERS
        value: "2"                     # free=512MB: poucos workers (+ --preload). Pago: 4.
      - key: RUN_SEED
        value: "false"                 # PROD: NAO re-seeda demo. (true so no 1o deploy de validacao)
      - key: RUN_DEMO
        value: "false"                 # PROD: NAO recria clinicas demo nem super-admin de senha fraca.
      - key: PUBLIC_BASE_URL
        value: https://nousclinical.com
      # --- Funcionalidades novas: prontas em prod, a clinica/PGS so "conecta" ---
      - key: WHATSAPP_ATIVO
        value: "true"                  # libera a tela de conexao; cada clinica cola seu numero/token.
                                       # Inerte ate conectar (sem trafego/custo). Quem paga a Meta e a clinica.
      # WHATSAPP_ENC_KEY: nao definido de proposito -> a cifragem do token deriva do
      # SECRET_KEY (estavel no Render). NAO rotacionar SECRET_KEY depois que clinicas
      # conectarem o WhatsApp, senao os tokens precisam ser recolados.
      - key: AJUDA_IA_ATIVA
        value: "true"                  # chatbot "armado": so liga quando ANTHROPIC_API_KEY for preenchida.
      - key: ANTHROPIC_API_KEY
        sync: false                    # SEGREDO (PGS paga). Cole no dashboard p/ ativar o chatbot. Vazio = off.
      # Storage de arquivos (logo + exames). STORAGE_BACKEND=s3 + as 4 chaves
      # abaixo (preenchidas no dashboard, sync:false=secretas). Enquanto vazias,
      # cai pro disco local automaticamente (sem quebrar).
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false          # Banco EXTERNO agora (Neon free — Postgres real, nao
                             # apaga por inatividade). Cole no dashboard do Render a
                             # connection string do POOLER do Neon (host '...-pooler',
                             # com '?sslmode=require'). ATENCAO: se ficar VAZIA, o app
                             # cai pro SQLite efemero e PERDE dados a cada deploy —
                             # defina ANTES do primeiro deploy. Passo a passo em
                             # docs/12-migracao-banco-neon.md.

# Sem bloco `databases:` — saimos do Postgres gerenciado do Render (o free apaga em
# 30d+14, sem backup) para o Neon (externo, custo zero, nao apaga por inatividade).
# Depois de migrar e o app subir na URL do Neon, delete manualmente o banco antigo
# 'nous-clinical-db' no dashboard do Render.
