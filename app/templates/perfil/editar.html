{% extends "base.html" %}
{% block title %}Meu perfil — Nous Clinical{% endblock %}
{% block content %}
<div class="w-narrow">
  <div class="page-header"><h2>Meu perfil</h2></div>

  <form method="POST" action="{{ url_for('perfil.editar') }}" class="card mb-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email_ro">E-mail</label>
      <input type="email" id="email_ro" value="{{ current_user.email }}" disabled>
    </div>
    <div class="form-group">
      <label for="nome_responsavel">Nome</label>
      <input type="text" id="nome_responsavel" name="nome_responsavel" value="{{ current_user.nome_responsavel }}">
    </div>
    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" value="{{ current_user.telefone or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Salvar dados</button>
  </form>

  <form method="POST" action="{{ url_for('perfil.trocar_senha') }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3 class="mb-2">Trocar senha</h3>
    <div class="form-group">
      <label for="senha_atual">Senha atual</label>
      <input type="password" id="senha_atual" name="senha_atual" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="senha_nova">Nova senha (mín. 8)</label>
      <input type="password" id="senha_nova" name="senha_nova" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="senha_confirma">Confirme</label>
      <input type="password" id="senha_confirma" name="senha_confirma" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Trocar senha</button>
  </form>
</div>
{% endblock %}
