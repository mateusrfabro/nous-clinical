{% extends "base.html" %}
{% block title %}Acesso negado — Nous Clinical{% endblock %}
{% block content %}
<div class="error-page">
    <span class="error-page-eyebrow">Erro 403</span>
    <h1>403</h1>
    <h2>Acesso negado</h2>
    <p>Você não tem permissão para acessar este recurso.</p>
    <div class="error-page-actions">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Ir para o início</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline">Meu painel</a>
        {% endif %}
    </div>
</div>
{% endblock %}
