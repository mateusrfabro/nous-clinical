{% extends "base.html" %}
{% block title %}Reagendar consulta — Nous Clinical{% endblock %}
{% block content %}
<div class="w-narrow">
  <div class="page-header"><h2>Reagendar consulta</h2></div>
  <p class="muted mb-4">Paciente: <strong>{{ ag.paciente.nome_completo }}</strong></p>
  <form method="POST" action="{{ url_for('agenda.editar', agendamento_id=ag.id) }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="profissional_id">Profissional *</label>
      <select id="profissional_id" name="profissional_id" required>
        {% for p in profissionais %}<option value="{{ p.id }}" {{ 'selected' if form.get('profissional_id')|string == p.id|string }}>{{ p.nome }}{% if p.especialidade %} — {{ p.especialidade }}{% endif %}</option>{% endfor %}
      </select>
    </div>
    <div class="flex-form">
      <div class="form-group form-group-grow">
        <label for="dia">Dia *</label>
        <input type="date" id="dia" name="dia" required value="{{ form.get('dia','') }}">
      </div>
      <div class="form-group">
        <label for="hora">Hora *</label>
        <input type="time" id="hora" name="hora" required value="{{ form.get('hora','') }}">
      </div>
    </div>
    <div class="form-group">
      <label for="convenio">Convênio</label>
      <input type="text" id="convenio" name="convenio" value="{{ form.get('convenio','') }}">
    </div>
    <div class="form-group">
      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes" rows="2">{{ form.get('observacoes','') }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Salvar reagendamento</button>
    <a href="{{ url_for('agenda.listar') }}" class="btn btn-outline">Cancelar</a>
  </form>
</div>
{% endblock %}
