{% extends "base.html" %}
{% block title %}Nova clínica — Nous Clinical{% endblock %}
{% block content %}
<div class="w-narrow">
  <div class="page-header">
    <h2>Nova clínica</h2>
    <p class="muted">Cria a clínica e o primeiro login admin dela.</p>
  </div>
  <form method="POST" action="{{ url_for('clinicas.nova') }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="nome">Nome da clínica *</label>
      <input type="text" id="nome" name="nome" required value="{{ form.get('nome','') }}">
    </div>
    <div class="form-group">
      <label for="slug">Identificador (slug)</label>
      <input type="text" id="slug" name="slug" value="{{ form.get('slug','') }}" placeholder="ex: clinica-sao-paulo">
    </div>
    <hr class="mt-4 mb-4">
    <div class="page-header section-title-mt"><h3>Admin da clínica</h3></div>
    <div class="form-group">
      <label for="admin_nome">Nome *</label>
      <input type="text" id="admin_nome" name="admin_nome" required value="{{ form.get('admin_nome','') }}">
    </div>
    <div class="flex-form">
      <div class="form-group form-group-grow">
        <label for="admin_email">E-mail (login) *</label>
        <input type="email" id="admin_email" name="admin_email" required value="{{ form.get('admin_email','') }}">
      </div>
      <div class="form-group form-group-grow">
        <label for="senha">Senha provisória (mín. 8) *</label>
        <input type="password" id="senha" name="senha" required minlength="8" autocomplete="new-password">
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Criar clínica</button>
    <a href="{{ url_for('clinicas.listar') }}" class="btn btn-outline">Cancelar</a>
  </form>
</div>
{% endblock %}
