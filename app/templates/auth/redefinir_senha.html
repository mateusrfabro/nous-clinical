{% extends "base.html" %}
{% block title %}Redefinir senha — Nous Clinical{% endblock %}
{% block content %}
<div class="w-narrow">
  <div class="page-header"><h2>Nova senha</h2></div>
  <form method="POST" action="{{ url_for('auth.redefinir_senha', token=token) }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group {% if erro_senha_curta %}is-invalid{% endif %}">
      <label for="senha">Senha (mín. 8 caracteres)</label>
      <input type="password" id="senha" name="senha" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group {% if erro_match %}is-invalid{% endif %}">
      <label for="confirmacao">Confirme a senha</label>
      <input type="password" id="confirmacao" name="confirmacao" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Redefinir senha</button>
  </form>
</div>
{% endblock %}
